name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # pnpm's version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Real-git tests commit in temporary repositories.
      - name: Git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Test
        run: pnpm test

      # `bb plugin build` comes with the bb CLI (npm package bb-app); it needs no running BB server.
      # Pinned to the oldest BB the plugin supports (package.json engines.bb).
      - name: Build
        run: npx --yes --package bb-app@0.45.0 bb plugin build .
